// ── INDEXEDDB ─────────────────────────────────────────────────────────────────
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('PartyKasse', 2);
    req.onerror = () => reject(req.error);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('articles')) db.createObjectStore('articles', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('sales'))    db.createObjectStore('sales',    { keyPath: 'id' });
      if (!db.objectStoreNames.contains('bookings')) db.createObjectStore('bookings', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
  });
}
async function dbGetAll(store) {
  const db = await openDB();
  return new Promise((resolve) => {
    const req = db.transaction(store, 'readonly').objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => resolve([]);
  });
}
async function dbPutAll(store, items) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction(store, 'readwrite');
    const s  = tx.objectStore(store);
    s.clear();
    items.forEach(i => s.put(i));
    tx.oncomplete = resolve;
  });
}
async function dbAdd(store, item) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).add(item);
    tx.oncomplete = resolve;
  });
}
async function dbClear(store) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = resolve;
  });
}

// ── EXCEL EXPORT ──────────────────────────────────────────────────────────────
function exportBookingsExcel(bookings) {
  const rows = [];
  bookings.forEach(b => {
    const date = new Date(b.timestamp);
    const dateStr = date.toLocaleDateString('de-DE');
    const timeStr = date.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
    b.items.forEach(item => {
      rows.push({
        'Datum':        dateStr,
        'Uhrzeit':      timeStr,
        'Buchungs-ID':  b.id,
        'Artikel':      item.name,
        'Kategorie':    item.category || '',
        'Menge':        item.quantity,
        'Einzelpreis':  item.price,
        'Gesamtpreis':  item.totalPrice,
        'Gegeben (€)':  b.paid ?? '',
        'Rückgeld (€)': b.change != null ? b.change.toFixed(2) : '',
        'Trinkgeld (€)':b.tip   != null && b.tip > 0 ? b.tip.toFixed(2) : '',
        'Buchungssumme':b.total,
      });
    });
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  // Spaltenbreiten
  ws['!cols'] = [
    {wch:12},{wch:8},{wch:22},{wch:20},{wch:12},
    {wch:6},{wch:12},{wch:12},{wch:12},{wch:12},{wch:14}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Buchungen');
  const date = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, `party-kasse-buchungen-${date}.xlsx`);
}

function exportStatsExcel(bookings, articles) {
  const wb = XLSX.utils.book_new();

  // Sheet 1: Tagesübersicht
  const byDay = {};
  bookings.forEach(b => {
    const day = new Date(b.timestamp).toLocaleDateString('de-DE');
    if (!byDay[day]) byDay[day] = { date: day, bookings: 0, revenue: 0, paid: 0 };
    byDay[day].bookings++;
    byDay[day].revenue += b.total;
    byDay[day].paid    += b.paid ?? b.total;
  });
  const dayRows = Object.values(byDay).map(d => ({
    'Datum':          d.date,
    'Buchungen':      d.bookings,
    'Umsatz (€)':     +d.revenue.toFixed(2),
    'Eingenommen (€)':+d.paid.toFixed(2),
  }));
  const ws1 = XLSX.utils.json_to_sheet(dayRows.length ? dayRows : [{'Hinweis':'Keine Daten'}]);
  ws1['!cols'] = [{wch:14},{wch:10},{wch:13},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Tagesübersicht');

  // Sheet 2: Artikel-Statistik
  const artStats = {};
  bookings.forEach(b => {
    b.items.forEach(item => {
      if (!artStats[item.name]) artStats[item.name] = { name: item.name, qty: 0, revenue: 0 };
      artStats[item.name].qty     += item.quantity;
      artStats[item.name].revenue += item.totalPrice;
    });
  });
  const artRows = Object.values(artStats)
    .sort((a,b) => b.qty - a.qty)
    .map(a => ({
      'Artikel':      a.name,
      'Verkauft':     a.qty,
      'Umsatz (€)':  +a.revenue.toFixed(2),
    }));
  const ws2 = XLSX.utils.json_to_sheet(artRows.length ? artRows : [{'Hinweis':'Keine Daten'}]);
  ws2['!cols'] = [{wch:22},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Artikel-Statistik');

  // Sheet 3: Aktueller Lagerbestand
  const stockRows = articles.map(a => ({
    'Artikel':    a.name,
    'Kategorie':  a.category,
    'Preis (€)':  a.price,
    'Bestand':    a.stock,
    'Status':     a.active ? 'Aktiv' : 'Inaktiv',
  }));
  const ws3 = XLSX.utils.json_to_sheet(stockRows);
  ws3['!cols'] = [{wch:22},{wch:12},{wch:10},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws3, 'Lagerbestand');

  const date = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, `party-kasse-statistik-${date}.xlsx`);
}

    .booking-money{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
    .booking-paid{font-size:10px;color:${muted}}
    .booking-change{font-size:11px;font-weight:600;color:#10b981}
    .booking-change.exact{color:${muted}}
    .bchevron{font-size:11px;color:${muted};transition:transform .2s;flex-shrink:0}
    .bchevron.open{transform:rotate(180deg)}
    .booking-body{border-top:1px solid ${border};padding:10px 13px}
    .booking-item{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid ${border}}
    .booking-item:last-of-type{border-bottom:none}
    .booking-item-name{color:${text}}
    .booking-item-detail{color:${muted};font-size:11px}
    .booking-footer{display:flex;justify-content:flex-end;gap:6px;padding-top:10px;margin-top:6px;border-top:1px solid ${border}}
    /* ADMIN */
    .ah{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
    .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .sr{flex:1;min-width:140px;padding:9px 12px;border:1.5px solid ${border};border-radius:9px;background:${bg};color:${text};font-size:12px}
    .sr:focus{outline:none;border-color:#3b82f6}
    .btn{padding:9px 12px;border:1.5px solid ${border};border-radius:9px;background:${surface};color:${text};font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
    .btn:hover{background:${card}}
    .btn.p{background:#3b82f6;color:#fff;border-color:#3b82f6}
    .btn.p:hover{background:#2563eb}
    .btn.d{background:#ef4444;color:#fff;border-color:#ef4444}
    .btn.d:hover{background:#dc2626}
    .btn.s{padding:5px 8px;font-size:10px}
    .btn.g{color:#10b981;border-color:#10b981}
    .btn.m{color:${muted}}
    .btn.xl{padding:10px 16px;font-size:12px;background:#10b981;color:#fff;border-color:#10b981}
    .btn.xl:hover{background:#059669}
    .fr{display:flex;gap:4px}
    .fb{padding:6px 11px;border:1.5px solid ${border};border-radius:7px;background:${bg};color:${muted};font-size:11px;cursor:pointer;transition:all .15s}
    .fb.on{background:#3b82f6;color:#fff;border-color:#3b82f6}
    .tgl{padding:7px 11px;border:1.5px solid ${border};border-radius:9px;background:${surface};cursor:pointer;font-size:16px;line-height:1;transition:all .15s}
    .tgl:hover{background:${card}}
    .al{display:flex;flex-direction:column;gap:7px}
    .ar{display:flex;align-items:center;gap:9px;padding:11px;background:${surface};border:1px solid ${border};border-radius:9px;transition:opacity .2s}
    .ar.off{opacity:.38}
    .ai{flex:1;min-width:0}
    .ai .an{font-size:12px;font-weight:600}
    .ai .am{font-size:10px;color:${muted};margin-top:1px}
    .ask{font-size:10px;color:${muted};min-width:70px;text-align:right}
    .acs{display:flex;gap:4px;flex-shrink:0}
    /* RESET KARTE */
    .reset-card{background:${dark?'rgba(239,68,68,.1)':'rgba(239,68,68,.05)'};border:1.5px solid ${dark?'rgba(239,68,68,.3)':'rgba(239,68,68,.2)'};border-radius:12px;padding:16px;margin-bottom:16px}
    .reset-card h3{font-size:13px;font-weight:700;color:#ef4444;margin-bottom:6px}
    .reset-card p{font-size:12px;color:${muted};margin-bottom:12px;line-height:1.5}
    /* MODAL */
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:14px}
    .mod{background:${surface};border-radius:15px;padding:20px;max-width:360px;width:100%;box-shadow:0 20px 36px rgba(0,0,0,.3)}
    .mod h3{font-size:16px;margin-bottom:12px}
    .ff{width:100%;padding:9px 12px;border:1.5px solid ${border};border-radius:9px;background:${bg};color:${text};font-size:13px;margin-bottom:9px;font-family:inherit}
    .ff:focus{outline:none;border-color:#3b82f6}
    .mf{display:flex;gap:6px;margin-top:10px}
    .mf .btn{flex:1}
    /* TOAST */
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:11px 22px;border-radius:11px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,.2);animation:fu .3s ease;white-space:nowrap}
    @keyframes fu{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @media(max-width:420px){.grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}}
    .divider{height:1px;background:${border};margin:16px 0}
  `;
}

// ── APP ────────────────────────────────────────────────────────────────────────
function App() {
  const [theme,        setTheme]        = useState(() => localStorage.getItem('pk-theme') || 'light');
  const [view,         setView]         = useState('sales');
  const [articles,     setArticles]     = useState(DEFAULT_ARTICLES);
  const [sales,        setSales]        = useState([]);
  const [bookings,     setBookings]     = useState([]);
  const [cart,         setCart]         = useState({});
  const [lastBooking,  setLastBooking]  = useState(null);
  const [toast,        setToast]        = useState(null);
  const [showPay,      setShowPay]      = useState(false);
  const [payInput,     setPayInput]     = useState('');
  const [noChange,     setNoChange]     = useState(false); // Trinkgeld: kein Rückgeld ausgeben
  const [filter,       setFilter]       = useState('all');
  const [search,       setSearch]       = useState('');
  const [editId,       setEditId]       = useState(null);
  const [editBuf,      setEditBuf]      = useState({});
  const [showNew,      setShowNew]      = useState(false);
  const [newA,         setNewA]         = useState({ name:'', category:'Getränke', price:'', stock:'' });
  const [dashTab,      setDashTab]      = useState('stats');
  const [openBooking,  setOpenBooking]  = useState(null);
  // Confirm-Dialog state
  const [confirm,      setConfirm]      = useState(null); // { title, msg, icon, onYes }
  const fileRef = useRef(null);

  useEffect(() => { localStorage.setItem('pk-theme', theme); }, [theme]);
  useEffect(() => {
    (async () => {
      const a = await dbGetAll('articles');
      const s = await dbGetAll('sales');
      const b = await dbGetAll('bookings');
      if (a.length > 0) setArticles(a);
      if (s.length > 0) setSales(s);
      if (b.length > 0) setBookings(b.sort((x,y) => y.timestamp - x.timestamp));
    })();
  }, []);

  const saveArticles = useCallback(async (list) => {
    setArticles(list);
    await dbPutAll('articles', list);
  }, []);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2800); };

  // ── CONFIRM HELPER ──────────────────────────────────────────────────────────
  const askConfirm = (title, msg, icon, onYes) => setConfirm({ title, msg, icon, onYes });

  // ── WARENKORB ──────────────────────────────────────────────────────────────
  const addToCart = (a) => {
    setCart(prev => {
      const qty = (prev[a.id]?.quantity || 0) + 1;
      if (qty > a.stock) return prev;
      return { ...prev, [a.id]: { article: a, quantity: qty } };
    });
  };
  const changeQty = (id, d) => {
    setCart(prev => {
      const e = prev[id]; if (!e) return prev;
      const q = e.quantity + d;
      if (q <= 0) { const n={...prev}; delete n[id]; return n; }
      if (q > e.article.stock) return prev;
      return { ...prev, [id]: { ...e, quantity: q } };
    });
  };
  const removeFromCart = (id) => setCart(prev => { const n={...prev}; delete n[id]; return n; });
  const clearCart = () => setCart({});

  const cartItems = Object.values(cart);
  const cartTotal = cartItems.reduce((s,i) => s + i.article.price * i.quantity, 0);
  const cartCount = cartItems.reduce((s,i) => s + i.quantity, 0);
  const paidNum   = parseFloat(payInput.replace(',','.')) || 0;
  const change    = paidNum - cartTotal;
  const quickAmounts = (() => {
    const candidates = [5,10,20,50,100].filter(v => v >= cartTotal);
    return [cartTotal, ...candidates.slice(0,2)].slice(0,4);
  })();

  // ── BUCHEN ─────────────────────────────────────────────────────────────────
  const handleBook = async () => {
    if (!cartItems.length) return;
    const now = Date.now(), bid = `b-${now}`;
    const paid = paidNum || cartTotal;
    const tip  = (noChange && paidNum > cartTotal) ? +(paidNum - cartTotal).toFixed(2) : 0;
    const chg  = noChange ? 0 : paid - cartTotal;
    const updatedArticles = articles.map(a => {
      const item = cart[a.id];
      return item ? { ...a, stock: Math.max(0, a.stock - item.quantity) } : a;
    });
    const records = cartItems.map(i => ({
      id:`${bid}-${i.article.id}`, bookingId:bid, timestamp:now,
      articleId:i.article.id, articleName:i.article.name,
      quantity:i.quantity, price:i.article.price, totalPrice:i.article.price * i.quantity,
    }));
    const bookingHead = {
      id:bid, timestamp:now, total:cartTotal, paid, change:chg, tip,
      items: cartItems.map(i => ({
        id:i.article.id, name:i.article.name, category:i.article.category||'',
        quantity:i.quantity, price:i.article.price, totalPrice:i.article.price * i.quantity,
      })),
    };
    for (const r of records) await dbAdd('sales', r);
    await dbAdd('bookings', bookingHead);
    setSales(prev => [...records, ...prev]);
    setBookings(prev => [bookingHead, ...prev]);
    await saveArticles(updatedArticles);
    setLastBooking({ bookingId:bid, items:cartItems, timestamp:now, total:cartTotal });
    setCart({});
    setShowPay(false);
    setPayInput('');
    showToast(`✓ Gebucht · € ${cartTotal.toFixed(2)}${tip>0?`  |  🎉 Trinkgeld: € ${tip.toFixed(2)}`:chg>0.001?`  |  Rückgeld: € ${chg.toFixed(2)}`:''}`);
  };

  // ── STORNO EINZELNE BUCHUNG ────────────────────────────────────────────────
  const stornoBooking = async (b) => {
    const bid = b.id;
    // Lager zurückbuchen
    const restored = articles.map(a => {
      const item = b.items.find(i => i.id === a.id);
      return item ? { ...a, stock: a.stock + item.quantity } : a;
    });
    const newSales    = sales.filter(s => s.bookingId !== bid);
    const newBookings = bookings.filter(x => x.id !== bid);
    setSales(newSales);
    setBookings(newBookings);
    await dbPutAll('sales', newSales);
    await dbPutAll('bookings', newBookings);
    await saveArticles(restored);
    if (lastBooking?.bookingId === bid) setLastBooking(null);
    setOpenBooking(null);
    showToast('↶ Buchung storniert & Lager wiederhergestellt');
  };

  // ── EINZELNE BUCHUNG LÖSCHEN (ohne Lager-Rückbuchung) ────────────────────
  const deleteBooking = async (b) => {
    const bid = b.id;
    const newSales    = sales.filter(s => s.bookingId !== bid);
    const newBookings = bookings.filter(x => x.id !== bid);
    setSales(newSales);
    setBookings(newBookings);
    await dbPutAll('sales', newSales);
    await dbPutAll('bookings', newBookings);
    if (lastBooking?.bookingId === bid) setLastBooking(null);
    setOpenBooking(null);
    showToast('🗑 Buchung gelöscht');
  };

  // ── ALLES ZURÜCKSETZEN ────────────────────────────────────────────────────
  const handleFullReset = async () => {
    setSales([]);
    setBookings([]);
    setCart({});
    setLastBooking(null);
    await dbClear('sales');
    await dbClear('bookings');
    showToast('✓ Kasse zurückgesetzt – bereit für neuen Tag!');
  };

  // ── ADMIN ──────────────────────────────────────────────────────────────────
  const toggleActive   = (id) => saveArticles(articles.map(a => a.id===id ? {...a,active:!a.active} : a));
  const handleSaveEdit = () => { saveArticles(articles.map(a => a.id===editId ? {...a,...editBuf} : a)); setEditId(null); };
  const handleDelete   = (id) => { saveArticles(articles.filter(a => a.id!==id)); setEditId(null); };
  const handleAddNew   = () => {
    if (!newA.name || newA.price==='') return;
    saveArticles([...articles, { id:`${Date.now()}`, name:newA.name, category:newA.category, price:parseFloat(newA.price)||0, stock:parseInt(newA.stock)||0, active:true }]);
    setNewA({ name:'', category:'Getränke', price:'', stock:'' });
    setShowNew(false);
  };
  const handleExportCSV = () => {
    const csv = 'name,category,price,stock,active\n' + articles.map(a=>`${a.name},${a.category},${a.price},${a.stock},${a.active}`).join('\n');
    const url = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    Object.assign(document.createElement('a'),{href:url,download:`kasse-artikel-${new Date().toISOString().split('T')[0]}.csv`}).click();
  };
  const handleImport = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const imported = ev.target.result.split('\n').slice(1).filter(Boolean).map((line,i) => {
          const [name,category,price,stock,active] = line.split(',');
          return { id:`imp-${i}-${Date.now()}`, name:name?.trim(), category:category?.trim()||'Getränke', price:parseFloat(price)||0, stock:parseInt(stock)||0, active:active?.trim()==='true' };
        });
        await saveArticles([...articles,...imported]);
        showToast(`✓ ${imported.length} Artikel importiert`);
      } catch { alert('Import fehlgeschlagen'); }
    };
    reader.readAsText(file);
    e.target.value='';
  };

  // ── BERECHNUNGEN ───────────────────────────────────────────────────────────
  const totalRev = sales.reduce((s,x) => s+x.totalPrice, 0);
  const totalTx  = bookings.length;
  const drinks   = articles.filter(a => a.active && a.category==='Getränke');
  const snacks   = articles.filter(a => a.active && a.category==='Snacks');
  const filtered = articles.filter(a => {
    if (filter==='active'   && !a.active) return false;
    if (filter==='inactive' &&  a.active) return false;
    if (search && !a.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  const today  = new Date().toDateString();
  const ts     = sales.filter(s => new Date(s.timestamp).toDateString()===today);
  const tBk    = bookings.filter(b => new Date(b.timestamp).toDateString()===today);
  const tRev   = ts.reduce((s,x) => s+x.totalPrice, 0);
  const tTx    = tBk.length;
  const tAvg   = tTx>0 ? tRev/tTx : 0;
  const top5   = Object.entries(ts.reduce((a,s)=>{ a[s.articleName]=(a[s.articleName]||0)+s.quantity; return a; },{})).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const low    = articles.filter(a => a.active && a.stock<=5);
  const dark   = theme==='dark';
  const openEdit = (a) => { setEditBuf({name:a.name,category:a.category,price:a.price,stock:a.stock}); setEditId(a.id); };

  // ── RENDER ─────────────────────────────────────────────────────────────────
  return (
    <>
      <style>{buildCSS(dark)}</style>
      {toast && <div className="toast">{toast}</div>}

      {/* ── CONFIRM DIALOG ───────────────────────────────────────────────── */}
      {confirm && (
        <div className="confirm-overlay" onClick={() => setConfirm(null)}>
          <div className="confirm-modal" onClick={e => e.stopPropagation()}>
            <div className="confirm-icon">{confirm.icon}</div>
            <div className="confirm-title">{confirm.title}</div>
            <div className="confirm-msg">{confirm.msg}</div>
            <div className="confirm-actions">
              <button className="confirm-no" onClick={() => setConfirm(null)}>Abbrechen</button>
              <button className="confirm-yes" onClick={() => { confirm.onYes(); setConfirm(null); }}>Ja, fortfahren</button>
            </div>
          </div>
        </div>
      )}

      <div className="app">
        <nav className="nav">
          {[['sales','💰 Verkauf'],['dashboard','📊 Dashboard'],['admin','⚙️ Verwaltung']].map(([v,l]) => (
            <button key={v} className={`nb${view===v?' on':''}`} onClick={() => setView(v)}>{l}</button>
          ))}
        </nav>

        {/* ══ VERKAUF ═══════════════════════════════════════════════════════ */}
        {view==='sales' && (
          <div className="sl">
            <div className="ac">
              <div className="stats">
                <div className="sc"><div className="sc-l">Gesamtumsatz</div><div className="sc-v">€ {totalRev.toFixed(2)}</div></div>
                <div className="sc"><div className="sc-l">Buchungen</div><div className="sc-v">{totalTx}</div></div>
                <div className="sc"><div className="sc-l">Ø/Buchung</div><div className="sc-v">€ {totalTx>0?(totalRev/totalTx).toFixed(2):'0.00'}</div></div>
              </div>
              {[['Getränke',drinks],['Snacks',snacks]].map(([cat,list]) => list.length ? (
                <div className="sec" key={cat}>
                  <div className="st">{cat}</div>
                  <div className="grid">
                    {list.map(a => {
                      const inC = cart[a.id]?.quantity || 0;
                      const eff = a.stock - inC;
                      return (
                        <button key={a.id} className="ab" onClick={() => addToCart(a)} disabled={a.stock<=inC}>
                          {inC>0 && <span className="bdg">{inC}</span>}
                          <div className="an">{a.name}</div>
                          <div className="ap">€ {a.price.toFixed(2)}</div>
                          <div className={`as${eff<=5?' low':''}`}>Bestand: {eff}</div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              ) : null)}
            </div>

            <div className="cc">
              <div className="cart">
                <div className="ch">
                  <span className="ct">🛒 Warenkorb{cartCount>0?` (${cartCount})`:''}</span>
                  {cartCount>0 && <button className="cc-btn" onClick={clearCart}>Leeren</button>}
                </div>
                <div className="cb">
                  {cartItems.length===0
                    ? <div className="ce"><span className="ce-i">🛒</span>Noch keine Artikel ausgewählt</div>
                    : cartItems.map(({article:a,quantity:q}) => (
                        <div key={a.id} className="ci">
                          <span className="cin">{a.name}</span>
                          <div className="qc">
                            <button className="qb" onClick={()=>changeQty(a.id,-1)}>−</button>
                            <span className="qn">{q}</span>
                            <button className="qb" onClick={()=>changeQty(a.id,+1)} disabled={q>=a.stock}>+</button>
                          </div>
                          <span className="cip">€ {(a.price*q).toFixed(2)}</span>
                          <button className="cdl" onClick={()=>removeFromCart(a.id)}>✕</button>
                        </div>
                      ))
                  }
                </div>
                <div className="cf">
                  {lastBooking && (
                    <div className="lbk">
                      <div className="lbi">Zuletzt: <strong>€ {lastBooking.total.toFixed(2)}</strong></div>
                      <button className="sb" onClick={() => askConfirm(
                        'Buchung stornieren?',
                        `Die letzte Buchung über € ${lastBooking.total.toFixed(2)} wird storniert und der Bestand wiederhergestellt.`,
                        '↶',
                        () => stornoBooking(bookings.find(b => b.id === lastBooking.bookingId) || lastBooking)
                      )}>↶ Storno</button>
                    </div>
                  )}
                  <div className="tr">
                    <span className="tl">Gesamt</span>
                    <span className="tv">€ {cartTotal.toFixed(2)}</span>
                  </div>
                  <button className="bkbtn" onClick={() => { setPayInput(''); setNoChange(false); setShowPay(true); }} disabled={cartCount===0}>
                    {cartCount===0 ? 'Artikel wählen …' : `💳 Zur Kasse · € ${cartTotal.toFixed(2)}`}
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ══ BEZAHL-MODAL ══════════════════════════════════════════════════ */}
        {showPay && (
          <div className="pay-overlay" onClick={()=>setShowPay(false)}>
            <div className="pay-modal" onClick={e=>e.stopPropagation()}>
              <h3>💳 Bezahlung</h3>
              <div className="pay-subtitle">Wie viel hat der Kunde gegeben?</div>
              <div className="pay-total">
                <span className="pay-total-lbl">Zu zahlen</span>
                <span className="pay-total-val">€ {cartTotal.toFixed(2)}</span>
              </div>
              <div className="quick-btns">
                {quickAmounts.map((amt,i) => (
                  <button key={i} className={`quick-btn${Math.abs(amt-cartTotal)<0.001?' exact':''}`}
                    onClick={()=>setPayInput(Math.abs(amt-cartTotal)<0.001?cartTotal.toFixed(2):amt.toFixed(2))}>
                    {Math.abs(amt-cartTotal)<0.001 ? '✓ Exakt' : `€ ${amt.toFixed(0)}`}
                  </button>
                ))}
              </div>
              <input className="pay-input" type="number" step="0.01" min="0"
                placeholder={`€ ${cartTotal.toFixed(2)}`} value={payInput}
                onChange={e=>setPayInput(e.target.value)} autoFocus />

              {/* Trinkgeld-Toggle – nur sichtbar wenn mehr gezahlt als fällig */}
              {paidNum > cartTotal + 0.001 && (
                <div className={`tip-row${noChange?' on':''}`} onClick={()=>setNoChange(v=>!v)}>
                  <span className="tip-label">
                    🎉 Trinkgeld behalten
                    {noChange && <span style={{fontSize:11,fontWeight:400,opacity:.8}}>(kein Rückgeld)</span>}
                  </span>
                  {noChange && <span className="tip-amount">+ € {(paidNum - cartTotal).toFixed(2)}</span>}
                  <div className={`tip-toggle${noChange?' on':''}`} />
                </div>
              )}

              {/* Rückgeld / Zu wenig / Trinkgeld-Info */}
              <div className={`change-row${
                payInput==='' ? ' neu'
                : noChange && paidNum > cartTotal + 0.001 ? ' pos'
                : change >= 0 ? ' pos' : ' neg'
              }`}>
                <span className="change-lbl">
                  {payInput==='' ? 'Betrag eingeben'
                   : noChange && paidNum > cartTotal + 0.001 ? '🎉 Trinkgeld'
                   : change < 0 ? '⚠️ Zu wenig'
                   : 'Rückgeld'}
                </span>
                {payInput!=='' && (
                  <span className={`change-val${
                    noChange && paidNum > cartTotal + 0.001 ? ' pos'
                    : change >= 0 ? ' pos' : ' neg'
                  }`}>
                    {noChange && paidNum > cartTotal + 0.001
                      ? `€ ${(paidNum - cartTotal).toFixed(2)}`
                      : change < 0
                        ? `− € ${Math.abs(change).toFixed(2)}`
                        : `€ ${change.toFixed(2)}`}
                  </span>
                )}
              </div>
              <div className="pay-actions">
                <button className="pay-cancel" onClick={()=>setShowPay(false)}>Abbrechen</button>
                <button className="pay-confirm" onClick={handleBook} disabled={payInput!==''&&change<0}>
                  ✓ Buchen
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ══ DASHBOARD ═════════════════════════════════════════════════════ */}
        {view==='dashboard' && (
          <div className="main">
            <div className="dg">
              <div className="dc"><div className="dl">Umsatz heute</div><div className="dv">€ {tRev.toFixed(2)}</div></div>
              <div className="dc"><div className="dl">Buchungen</div><div className="dv">{tTx}</div></div>
              <div className="dc"><div className="dl">Ø/Buchung</div><div className="dv">€ {tAvg.toFixed(2)}</div></div>
            </div>

            <div className="dash-tabs">
              <button className={`dash-tab${dashTab==='stats'?' on':''}`} onClick={()=>setDashTab('stats')}>📈 Statistik</button>
              <button className={`dash-tab${dashTab==='bookings'?' on':''}`} onClick={()=>setDashTab('bookings')}>
                🧾 Buchungen{tBk.length>0?` (${tBk.length})`:''}
              </button>
            </div>

            {/* ── TAB: STATISTIK ─────────────────────────────────────────── */}
            {dashTab==='stats' && <>
              <div className="export-row">
                <button className="btn xl" onClick={() => exportStatsExcel(bookings, articles)}>
                  📊 Excel exportieren
                </button>
              </div>
              <div className="ds">
                <h2>🏆 Top Artikel heute</h2>
                {top5.length
                  ? <div className="tl2">{top5.map(([n,q])=><div key={n} className="ti"><span>{n}</span><span className="tq">{q}×</span></div>)}</div>
                  : <div className="emp">Noch keine Buchungen heute</div>
                }
              </div>
              {low.length>0 && (
                <div className="ds">
                  <h2>⚠️ Niedriger Bestand</h2>
                  <div className="tl2">
                    {low.map(a=>(
                      <div key={a.id} className="wi">
                        <span>{a.name}</span>
                        <span className={`wq${a.stock<=2?' crit':''}`}>{a.stock} übrig</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </>}

            {/* ── TAB: BUCHUNGEN ─────────────────────────────────────────── */}
            {dashTab==='bookings' && <>
              <div className="export-row">
                <button className="btn xl" onClick={() => exportBookingsExcel(bookings)}>
                  📊 Excel exportieren
                </button>
              </div>
              <div className="booking-list">
                {bookings.length===0
                  ? <div className="emp">Noch keine Buchungen vorhanden</div>
                  : bookings.map(b => {
                      const isOpen = openBooking===b.id;
                      return (
                        <div key={b.id} className="booking-card">
                          <div className="booking-head" onClick={()=>setOpenBooking(isOpen?null:b.id)}>
                            <div className="booking-meta">
                              <div className="booking-time">{fmtDate(b.timestamp)} · {fmtTime(b.timestamp)}</div>
                              <div className="booking-sum">
                                {b.items.length} Artikel · <strong style={{color:'#3b82f6'}}>€ {b.total.toFixed(2)}</strong>
                              </div>
                            </div>
                            <div className="booking-money">
                              {b.paid != null && <span className="booking-paid">Gegeben: € {b.paid.toFixed(2)}</span>}
                              {b.paid != null && (
                                b.tip > 0
                                  ? <span className="booking-change" style={{color:'#f59e0b'}}>🎉 Trinkgeld: € {b.tip.toFixed(2)}</span>
                                  : <span className={`booking-change${Math.abs(b.change??0)<0.001?' exact':''}`}>
                                      {Math.abs(b.change??0)<0.001?'Kein Rückgeld':`Rückgeld: € ${(b.change??0).toFixed(2)}`}
                                    </span>
                              )}
                            </div>
                            <span className={`bchevron${isOpen?' open':''}`}>▼</span>
                          </div>

                          {isOpen && (
                            <div className="booking-body">
                              {b.items.map((item,i) => (
                                <div key={i} className="booking-item">
                                  <span className="booking-item-name">{item.name}</span>
                                  <span className="booking-item-detail">
                                    {item.quantity}× € {item.price.toFixed(2)} = <strong>€ {item.totalPrice.toFixed(2)}</strong>
                                  </span>
                                </div>
                              ))}
                              <div className="booking-footer">
                                {/* STORNO: löscht + stellt Lager wieder her */}
                                <button className="btn s" onClick={() => askConfirm(
                                  'Buchung stornieren?',
                                  `Buchung über € ${b.total.toFixed(2)} wird storniert. Der Lagerbestand der Artikel wird wiederhergestellt.`,
                                  '↶',
                                  () => stornoBooking(b)
                                )}>↶ Storno</button>
                                {/* LÖSCHEN: nur aus Liste entfernen, kein Lager zurück */}
                                <button className="btn s d" onClick={() => askConfirm(
                                  'Buchung löschen?',
                                  `Die Buchung über € ${b.total.toFixed(2)} wird aus der Liste entfernt. Der Lagerbestand bleibt unverändert.`,
                                  '🗑',
                                  () => deleteBooking(b)
                                )}>🗑 Löschen</button>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })
                }
              </div>
            </>}
          </div>
        )}

        {/* ══ VERWALTUNG ════════════════════════════════════════════════════ */}
        {view==='admin' && (
          <div className="main">

            {/* RESET KARTE */}
            <div className="reset-card">
              <h3>🔄 Neuer Tag – Kasse zurücksetzen</h3>
              <p>Löscht alle Buchungen, Verkäufe und Statistiken. Die Artikel in der Verwaltung bleiben erhalten. Ideal zum Start eines neuen Veranstaltungstages.</p>
              <button className="btn d" onClick={() => askConfirm(
                'Kasse komplett zurücksetzen?',
                'Alle Buchungen, Verkäufe und Statistiken werden unwiderruflich gelöscht. Artikel und Preise bleiben erhalten.',
                '🔄',
                handleFullReset
              )}>
                🔄 Kasse zurücksetzen
              </button>
            </div>

            <div className="divider" />

            <div className="ah">
              <div className="row">
                <input className="sr" placeholder="Artikel suchen…" value={search} onChange={e=>setSearch(e.target.value)} />
                <button className="btn p" onClick={()=>setShowNew(true)}>+ Neuer Artikel</button>
              </div>
              <div className="row" style={{justifyContent:'space-between'}}>
                <div className="fr">
                  {[['all','Alle'],['active','Aktiv'],['inactive','Inaktiv']].map(([v,l])=>(
                    <button key={v} className={`fb${filter===v?' on':''}`} onClick={()=>setFilter(v)}>{l}</button>
                  ))}
                </div>
                <div className="row">
                  <button className="btn" onClick={handleExportCSV}>📋 CSV Export</button>
                  <label className="btn" style={{cursor:'pointer'}}>
                    📥 Import
                    <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}} onChange={handleImport} />
                  </label>
                  <button className="tgl" onClick={()=>setTheme(t=>t==='light'?'dark':'light')}>{dark?'☀️':'🌙'}</button>
                </div>
              </div>
            </div>

            <div className="al">
              {filtered.map(a=>(
                <div key={a.id} className={`ar${a.active?'':' off'}`}>
                  <div className="ai">
                    <div className="an">{a.name}</div>
                    <div className="am">{a.category} · € {a.price.toFixed(2)}</div>
                  </div>
                  <div className="ask">Bestand: {a.stock}</div>
                  <div className="acs">
                    <button className="btn s" onClick={()=>openEdit(a)}>✏️ Bearbeiten</button>
                    <button className={`btn s ${a.active?'g':'m'}`} onClick={()=>toggleActive(a.id)}>
                      {a.active?'✓ Aktiv':'✗ Inaktiv'}
                    </button>
                  </div>
                </div>
              ))}
              {filtered.length===0 && <div className="emp">Keine Artikel gefunden</div>}
            </div>

            {showNew && (
              <div className="ov" onClick={()=>setShowNew(false)}>
                <div className="mod" onClick={e=>e.stopPropagation()}>
                  <h3>Neuer Artikel</h3>
                  <input className="ff" placeholder="Name" value={newA.name} onChange={e=>setNewA({...newA,name:e.target.value})} />
                  <select className="ff" value={newA.category} onChange={e=>setNewA({...newA,category:e.target.value})}>
                    <option>Getränke</option><option>Snacks</option>
                  </select>
                  <input className="ff" type="number" placeholder="Preis (€)" step="0.01" min="0" value={newA.price} onChange={e=>setNewA({...newA,price:e.target.value})} />
                  <input className="ff" type="number" placeholder="Startbestand" min="0" value={newA.stock} onChange={e=>setNewA({...newA,stock:e.target.value})} />
                  <div className="mf">
                    <button className="btn p" onClick={handleAddNew}>Hinzufügen</button>
                    <button className="btn" onClick={()=>setShowNew(false)}>Abbrechen</button>
                  </div>
                </div>
              </div>
            )}

            {editId && (
              <div className="ov" onClick={()=>setEditId(null)}>
                <div className="mod" onClick={e=>e.stopPropagation()}>
                  <h3>Artikel bearbeiten</h3>
                  <input className="ff" placeholder="Name" value={editBuf.name||''} onChange={e=>setEditBuf({...editBuf,name:e.target.value})} />
                  <select className="ff" value={editBuf.category||'Getränke'} onChange={e=>setEditBuf({...editBuf,category:e.target.value})}>
                    <option>Getränke</option><option>Snacks</option>
                  </select>
                  <input className="ff" type="number" step="0.01" min="0" placeholder="Preis (€)" value={editBuf.price??''} onChange={e=>setEditBuf({...editBuf,price:parseFloat(e.target.value)||0})} />
                  <input className="ff" type="number" min="0" placeholder="Bestand" value={editBuf.stock??''} onChange={e=>setEditBuf({...editBuf,stock:parseInt(e.target.value)||0})} />
                  <div className="mf">
                    <button className="btn p" onClick={handleSaveEdit}>💾 Speichern</button>
                    <button className="btn d" onClick={()=>askConfirm(`Artikel löschen?`,`"${editBuf.name}" wird dauerhaft aus dem System entfernt.`,'🗑',()=>handleDelete(editId))}>🗑 Löschen</button>
                    <button className="btn" onClick={()=>setEditId(null)}>✕</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
